[agent]
id = "gpu-a6000"
hostname = "trainer-a6000"
hub_url = "https://farhelm.example.com"
token = "managed-by-farhelm-agent-pairing-do-not-copy"
heartbeat_seconds = 15
command_poll_seconds = 2
database = "/home/user/.local/share/farhelm/state/agent.db"

# Select an existing Codex installation; its parent directory is added to the child PATH.
[codex]
bin = "/home/user/.local/bin/codex"

# Existing TOML projects migrate into the local registry; new Codex projects are discovered automatically.
[projects.cc08]
path = "/srv/projects/cc08"
success_patterns = ["TRAINING COMPLETE", "Finished training"]
failure_patterns = ["CUDA out of memory", "Traceback \\(most recent call last\\)"]

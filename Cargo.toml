[workspace]
resolver = "2"
members = [
  "crates/farhelm-core",
  "crates/farhelm-protocol",
  "crates/farhelm-test-support",
  "crates/farhelm-updater",
  "crates/farhelm-lifecycle",
  "farhelm-hub",
  "farhelm-agent",
]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/Xiiiing/FarHelm"

[workspace.dependencies]
anyhow = "1.0"
async-stream = "0.3"
argon2 = "0.5"
axum = "0.8"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
constant_time_eq = "0.4"
flate2 = "1.1"
libc = "0.2"
regex = "1.11"
rand = "0.9"
farhelm-core = { path = "crates/farhelm-core" }
farhelm-lifecycle = { path = "crates/farhelm-lifecycle" }
farhelm-protocol = { path = "crates/farhelm-protocol" }
farhelm-test-support = { path = "crates/farhelm-test-support" }
farhelm-updater = { path = "crates/farhelm-updater" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rpassword = "7.5.4"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
semver = "1.0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
tempfile = "3.27.0"
tar = "0.4"
thiserror = "2.0"
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
urlencoding = "2.1"
web-push-native = { version = "0.5.0", default-features = false }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

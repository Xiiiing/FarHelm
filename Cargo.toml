[workspace]
resolver = "2"
members = [
  "crates/farhelm-core",
  "crates/farhelm-protocol",
  "crates/farhelm-test-support",
  "farhelm-hub",
  "farhelm-agent",
  "farhelmctl",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/Xiiiing/FarHelm"

[workspace.dependencies]
anyhow = "1.0"
axum = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
farhelm-core = { path = "crates/farhelm-core" }
farhelm-protocol = { path = "crates/farhelm-protocol" }
farhelm-test-support = { path = "crates/farhelm-test-support" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.47", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

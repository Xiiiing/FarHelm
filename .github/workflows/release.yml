name: Release

on:
  push:
    tags:
      - "V*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: farhelm-console/.node-version
          cache: pnpm
          cache-dependency-path: farhelm-console/pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tag matches package version
        run: |
          ./scripts/check-version-policy.sh
      - run: ./scripts/build-release.sh
      - run: ./tests/deployment-package.sh
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/release/farhelm-* \
            dist/release/SHA256SUMS \
            --verify-tag \
            --title "FarHelm $GITHUB_REF_NAME" \
            --draft \
            --generate-notes
          gh release edit "$GITHUB_REF_NAME" --draft=false
